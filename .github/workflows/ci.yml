name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rm -f package-lock.json && npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --run
      - run: npm run coverage
